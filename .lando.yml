# Express server example
name: replocator

#
# You need to run `lando npm install` before you run `lando start` for this
# example to work
#

# Give me http://express.lndo.site and https://express.lndo.site
proxy:
  appserver:
    - replocator.lndo.site

# Spin up services to run a basic node server
services:

  # Create an nginx service called "appserver"
  appserver:

    # Use nginx version 1.12
    type: nginx:1.12

    # Optionally configure nginx to be able to also serve over https
    ssl: true

    # Optionally use our own config files
    config:

      # Use custom nginx server config located in config/server.conf relative
      # to our app root
      server: config/nginx.conf

      overrides:
      services:
        ports: ['8888:80']

  # Create a node instance
  nodejs:

    # Node version 6.10
    type: node:6.10

    # Optionally specify a command to run when you start your node service up.
    #
    # If you are using node as a server you are going to want to define this.
    # This can be either a string or array.
    #
    # If you are just spinning up a node container to run front end dependencies
    # you can leave this blank and the container will boot up and stay on
    #
    # You will likely want to run `lando npm install` first so needed dependencies are
    # installed before your server starts up.
    #
    command: npm start

    # Pass in some docker compose overrides so we can map ports and get
    # more envvars
    overrides:
      services:
        ports: ['9999:80']

  # Spin up a mariadb container called "database"
  # NOTE: "database" is arbitrary, you could just as well call this "db" or "kanye"
  db:

    # Use the latest version of mysql
    type: mysql

    # Optionally forward out our port so we can access it at `localhost:someport`.
    # This port will change every time you restart this app
    #
    # You can also set this to a static port you want to use `portforward:3311`.
    # You will need to make sure the port is open and avialable
    portforward: true

  # Add a phpmyadmin db frontend
  pma:

    # Use the latest version of phpmyadmin
    type: phpmyadmin

    # The databases you want to look at, this will default to a service called
    # "database"
    #
    # You might want to run `lando info` on your app to see what databases you
    # have available
    hosts:
      - db

# Add some nice command routing
tooling:

  # Any node service with a defined command (aka not running in cli only mode)
  # Will also spin up a node cli container called `SERVICENAME_cli` (appserver_cli)
  # in this example.
  #
  # This will allow you to run things like `lando npm install` without needing
  # to `lando start` first. This is particularly needed for node based projects
  # since you almost always need to run `npm install` before you can boot up your
  # app successfully.
  npm:
    service: nodejs_cli
  node:
    service: nodejs_cli
  yarn:
    service: nodejs_cli