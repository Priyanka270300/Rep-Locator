<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Rep Locator Client</title>
  <script src="//code.jquery.com/jquery-1.11.0.min.js"></script>
  <script src="/locator.bundle.js"></script>

  <script>
    window.onload = function() {
      repLocator.init({
        brand: 'ECN',
        map: document.getElementById('locator-map'),
        stateInput: document.getElementById('locator-state'),
        countyInput: document.getElementById('locator-county'),
        zipInput: document.getElementById('locator-zip'),
        resetForm: document.getElementById('form-reset'),
        resultsBox: document.getElementById('locator-results'),
        repTemplate: '<div class="left">\
          <div class="contact">{{contact}}</div>\
          <div class="email"><a href="mailto:{{email}}">{{email}}</a></div>\
          <div class="agency">{{agency}}</div>\
          <div class="address">{{address}}<br>{{city}}, {{state}} {{zip}}</div>\
          <div class="notes">{{notes}}</div>\
          <div class="phone">P: <a>{{phone}}</a></div>\
          <div class="fax">F: <a>{{fax}}</a></div>\
        </div>',
      });
    }
  </script>
  <style>
    #locator-map path{fill:#de2525;stroke:#fff;stroke-width:1.5;stroke-opacity:.5}

    #locator-map text{font-family:"helvetica"; fill:#fff; font-size:11.906px;}
    #locator-map g { cursor: pointer }
    #locator-map g:hover path {fill: #b81717;}

    #replocator {
      overflow: auto;
    }
    #locator-map {
      width: 45%;
      float: left;
    }
    #locator-search, .results-wrapper {
      width: 27.5%;
      float: left;
    }
    #locator-search label {
      display: block;
      font-weight: bold;
    }
    #locator-results {
      border: 1px solid black;
      padding: 20px;
    }
  </style>
</head>
