<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Rep Locator Client</title>
  <script src="//code.jquery.com/jquery-1.11.0.min.js"></script>
  <script src="/client/locator.js"></script>
  <script src="//d3js.org/d3.v4.min.js"></script>
  <script src="//d3js.org/topojson.v2.min.js"></script>
  <script src="albers-usa-pr.js"></script>
  <style>

  .states :hover {
    fill: red;
  }

  .state-borders {
    fill: none;
    stroke: #fff;
    stroke-width: 0.5px;
    stroke-linejoin: round;
    stroke-linecap: round;
    pointer-events: none;
  }

  .labels {
    fill: pink;
    text-anchor: middle;
  }

  </style>
</head>
<body>
  <div id="replocator">
    <div id="map"></div>
    <form></form>
  </div>

  <script>

  var width = 960;
  var height = 600;

  var svg = d3.select("body").append("svg")
    .attr("width", width)
    .attr("height", height);

  var projection = albersUsaPr()
    .scale(1070)
    .translate([width / 2, height / 2]);

  var path = d3.geoPath()
    .projection(projection);

  d3.json("states.json", function(error, us) {
    if (error) throw error;

    d3.tsv("us-state-names.tsv", function(tsv){
      // extract just the codes and Ids
      var codes = {};
      tsv.forEach(function(d,i){
        codes[d.id] = d.code;
      });

      var state_data = topojson.feature(us, us.objects.states).features;

      svg.append("g")
        .attr("class", "states")
        .selectAll("path")
        .data(state_data)
        .enter().append("path")
        .attr("d", path)
        .attr("class", function(d) {
          return codes[d.id];
        });

      svg.append("g")
        .attr("class", "labels")
        .selectAll("text")
        .data(state_data)
        .enter()
        .append("svg:text")
        .text(function(d){
          return codes[d.id];
        })
        .attr("x", function(d){
            return path.centroid(d)[0];
        })
        .attr("y", function(d){
            return  path.centroid(d)[1];
        })
        .attr("class", function(d) {
          return codes[d.id];
        });

      svg.append("path")
          .attr("class", "state-borders")
          .attr("d", path(topojson.mesh(us, us.objects.states, function(a, b) { return a !== b; })));
    });
  });

  </script>
</body>
</html>
